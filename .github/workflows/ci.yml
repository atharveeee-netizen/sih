name: HoneyChain CI Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-test:
    name: Hardhat Smart Contracts Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install Contracts Dependencies
        working-directory: contracts
        run: npm ci

      - name: Run Hardhat Smart Contract Tests
        working-directory: contracts
        run: npx hardhat test

  gateway-ai-test:
    name: Python Gateway & AI Diagnostic Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Gateway & AI Test Suite
        run: python gateway/test_gateway_suite.py

      - name: Run End-to-End HoneyChain CLI Flow
        run: python demo_honeychain_flow.py

  frontend-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Production App
        working-directory: frontend
        run: npm run build
